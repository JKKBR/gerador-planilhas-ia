name: Verificação de qualidade

on:
  push:
    branches:
      - main
      - "melhoria/**"

  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar verificação completa
        run: npm run check
